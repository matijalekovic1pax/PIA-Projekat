<div class="flex min-h-screen items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-2xl space-y-8 bg-white p-8 rounded-xl shadow-lg">
        <div>
            <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">Create an account</h2>
            <p class="mt-2 text-center text-sm text-gray-500">New registrations require administrator approval.</p>
        </div>

        <form class="mt-8 space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

            <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
                <!-- Common Fields -->
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Account Type</label>
                    <select formControlName="type"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                        <option value="member">Network Member</option>
                        <option value="manager">Space Manager</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" formControlName="username"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" formControlName="password"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                    <span *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
                        class="text-xs text-red-500">
                        8-12 chars, 1 upper, 1 number, 1 special.
                    </span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">First Name</label>
                    <input type="text" formControlName="firstName"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Last Name</label>
                    <input type="text" formControlName="lastName"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" formControlName="email"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone</label>
                    <input type="text" formControlName="phone"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Profile Picture</label>
                    <input type="file" (change)="onFileSelected($event)" accept=".jpg,.jpeg,.png"
                        class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                    <p class="text-xs text-gray-500 mt-1">Optional. JPG/PNG, 100x100 to 300x300 pixels.</p>
                    <p *ngIf="imageError" class="text-xs text-red-500 mt-1">{{ imageError }}</p>
                </div>

                <!-- Manager Specific Fields -->
                <div *ngIf="isManager"
                    class="sm:col-span-2 border-t pt-4 mt-4 grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
                    <h3 class="sm:col-span-2 text-lg font-medium text-gray-900">Company Details</h3>

                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Company Name</label>
                        <input type="text" formControlName="companyName"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Address</label>
                        <input type="text" formControlName="companyAddress"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Reg. Number (8 digits)</label>
                        <input type="text" formControlName="companyRegNumber"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tax ID (PIB - 9 digits)</label>
                        <input type="text" formControlName="companyTaxId"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 py-2 px-3 border">
                    </div>
                </div>
            </div>

            <div *ngIf="errorMessage" class="text-red-600 text-sm text-center">
                {{ errorMessage }}
            </div>

            <div>
                <button type="submit" [disabled]="registerForm.invalid"
                    class="group relative flex w-full justify-center rounded-md bg-primary-600 py-2 px-3 text-sm font-semibold text-white hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 disabled:opacity-50">
                    Register
                </button>
            </div>

            <div class="text-center text-sm">
                <a routerLink="/login" class="font-medium text-primary-600 hover:text-primary-500">Already have an
                    account? Sign in</a>
            </div>
        </form>
    </div>
</div>
