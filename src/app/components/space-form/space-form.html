<div class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-6 text-gray-900">{{isEditMode ? 'Edit Space' : 'Create New Space'}}</h1>

        <form [formGroup]="spaceForm" (ngSubmit)="onSubmit()">
            <!-- Basic Info -->
            <div class="space-y-4 mb-8">
                <h3 class="text-lg font-medium text-gray-900 border-b pb-2">Basic Information</h3>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Space Name</label>
                    <input type="text" formControlName="name"
                        class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">City</label>
                        <input type="text" formControlName="city"
                            class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Address</label>
                        <input type="text" formControlName="address"
                            class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Price Per Hour ($)</label>
                    <input type="number" formControlName="pricePerHour"
                        class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea formControlName="description" rows="3"
                        class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Latitude</label>
                        <input type="text" formControlName="latitude" placeholder="e.g. 44.7866"
                            class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Longitude</label>
                        <input type="text" formControlName="longitude" placeholder="e.g. 20.4489"
                            class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                    </div>
                </div>
            </div>

            <!-- Capacity & Structure -->
            <div class="space-y-4 mb-8">
                <h3 class="text-lg font-medium text-gray-900 border-b pb-2">Structure & Capacity</h3>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Open Space Desks Count</label>
                    <input type="number" formControlName="openSpaceDeskCount"
                        class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                    <p class="text-xs text-gray-500 mt-1">Minimum 5 desks.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">No-show Limit</label>
                    <input type="number" formControlName="noShowLimit"
                        class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                    <p class="text-xs text-gray-500 mt-1">Number of no-shows before a member is blocked.</p>
                </div>

                <!-- Offices -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-medium text-gray-700">Private Offices</label>
                        <button type="button" (click)="addOffice()"
                            class="text-sm text-primary-600 hover:text-primary-800">+ Add Office</button>
                    </div>
                    <div formArrayName="offices" class="space-y-2">
                        <div *ngFor="let office of offices.controls; let i=index" [formGroupName]="i"
                            class="flex items-center space-x-2 bg-gray-50 p-2 rounded">
                            <input type="text" placeholder="Office Name (e.g. 101)" formControlName="name"
                                class="flex-1 rounded-md border-gray-300 border px-2 py-1 text-sm">
                            <input type="number" placeholder="Desks" formControlName="deskCount"
                                class="w-20 rounded-md border-gray-300 border px-2 py-1 text-sm">
                            <button type="button" (click)="removeOffice(i)" class="text-red-600 hover:text-red-800">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Conference Rooms -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-medium text-gray-700">Conference Rooms</label>
                        <button type="button" (click)="addConferenceRoom()"
                            class="text-sm text-primary-600 hover:text-primary-800">+ Add Room</button>
                    </div>
                    <div formArrayName="conferenceRooms" class="space-y-2">
                        <div *ngFor="let room of conferenceRooms.controls; let i=index" [formGroupName]="i"
                            class="flex items-center space-x-2 bg-gray-50 p-2 rounded">
                            <input type="text" placeholder="Room Name" formControlName="name"
                                class="flex-1 rounded-md border-gray-300 border px-2 py-1 text-sm">
                            <input type="text" placeholder="Equipment (e.g. Projector)" formControlName="equipment"
                                class="flex-1 rounded-md border-gray-300 border px-2 py-1 text-sm">
                            <button type="button" (click)="removeConferenceRoom(i)"
                                class="text-red-600 hover:text-red-800">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Images -->
            <div class="space-y-4 mb-8">
                <h3 class="text-lg font-medium text-gray-900 border-b pb-2">Images</h3>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Main Image</label>
                    <input type="file" (change)="onMainImageSelected($event)" accept="image/*"
                        class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                    <p class="text-xs text-gray-500 mt-1">Required for new spaces.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Gallery Images</label>
                    <input type="file" (change)="onGalleryImagesSelected($event)" accept="image/*" multiple
                        class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                </div>
            </div>

            <div *ngIf="message" class="mb-4 p-3 bg-red-100 text-red-700 rounded">{{message}}</div>

            <div class="flex justify-end space-x-3">
                <a routerLink="/manager/dashboard"
                    class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
                <button type="submit" [disabled]="spaceForm.invalid || loading"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50">
                    {{loading ? 'Saving...' : (isEditMode ? 'Update Space' : 'Create Space')}}
                </button>
            </div>

        </form>
    </div>
</div>
