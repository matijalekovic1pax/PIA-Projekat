<div class="bg-white p-4 rounded-lg shadow space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Space</label>
            <select [(ngModel)]="selectedSpaceId" (change)="onSelectionChange()"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border px-3 py-2">
                <option *ngFor="let space of spaces" [value]="space.id">{{space.name}}</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Element Type</label>
            <select [(ngModel)]="selectedElementType" (change)="onSelectionChange()"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border px-3 py-2">
                <option value="open">Open Space</option>
                <option value="office">Office</option>
                <option value="conference">Conference Room</option>
            </select>
        </div>
        <div *ngIf="selectedElementType !== 'open'">
            <label class="block text-sm font-medium text-gray-700">Element</label>
            <select [(ngModel)]="selectedElementName" (change)="onSelectionChange()"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border px-3 py-2">
                <option *ngFor="let name of elementOptions" [value]="name">{{name}}</option>
            </select>
        </div>
    </div>

    <full-calendar #managerCalendar [options]="calendarOptions"></full-calendar>
</div>
