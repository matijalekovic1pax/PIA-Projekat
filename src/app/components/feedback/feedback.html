<div class="mt-10 border-t pt-10">
    <h2 class="text-2xl font-bold mb-6">Reviews & Feedback</h2>

    <!-- Stats -->
    <div class="flex items-center space-x-6 mb-8">
        <div class="flex items-center text-green-600">
            <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5">
                </path>
            </svg>
            <span class="text-2xl font-bold">{{space?.likes || 0}}</span>
        </div>
        <div class="flex items-center text-red-600">
            <svg class="w-8 h-8 mr-2 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5">
                </path>
            </svg>
            <span class="text-2xl font-bold">{{space?.dislikes || 0}}</span>
        </div>
    </div>

    <!-- Review Form -->
    <div class="bg-gray-50 p-6 rounded-lg mb-8">
        <h3 class="text-lg font-medium mb-4">Leave a Review</h3>
        <form [formGroup]="feedbackForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Did you like this space?</label>
                <div class="flex space-x-4">
                    <button type="button" (click)="setRating(true)"
                        [class.bg-green-100]="feedbackForm.get('isLike')?.value === true"
                        [class.border-green-500]="feedbackForm.get('isLike')?.value === true"
                        class="px-4 py-2 border rounded-md flex items-center hover:bg-gray-100">
                        Like
                    </button>
                    <button type="button" (click)="setRating(false)"
                        [class.bg-red-100]="feedbackForm.get('isLike')?.value === false"
                        [class.border-red-500]="feedbackForm.get('isLike')?.value === false"
                        class="px-4 py-2 border rounded-md flex items-center hover:bg-gray-100">
                        Dislike
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Comment</label>
                <textarea formControlName="comment" rows="3"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border px-3 py-2"></textarea>
            </div>

            <div *ngIf="message" class="mb-4 text-sm"
                [class.text-green-600]="!message.includes('Failed') && !message.includes('cannot')"
                [class.text-red-600]="message.includes('Failed') || message.includes('cannot')">{{message}}</div>

            <button type="submit" [disabled]="feedbackForm.invalid"
                class="bg-primary-600 text-white rounded-md py-2 px-6 hover:bg-primary-500 disabled:opacity-50">Submit
                Review</button>
        </form>
    </div>

    <!-- Comments List -->
    <div class="space-y-6">
        <div *ngFor="let review of getRecentComments()"
            class="border-b pb-6 rounded-md px-2 -mx-2"
            [class.border-l-4]="isOwnComment(review)"
            [class.border-primary-500]="isOwnComment(review)">
            <div class="flex items-center mb-2">
                <div class="font-bold text-gray-900 mr-2">@{{review.username}}</div>
                <span class="text-xs text-gray-500">{{review.createdAt | date}}</span>
                <span *ngIf="review.isLike === true"
                    class="ml-2 text-green-600 text-xs font-bold bg-green-100 px-2 py-0.5 rounded">Liked</span>
                <span *ngIf="review.isLike === false"
                    class="ml-2 text-red-600 text-xs font-bold bg-red-100 px-2 py-0.5 rounded">Disliked</span>
            </div>
            <p class="text-gray-700">{{review.comment}}</p>
        </div>
        <div *ngIf="!space?.comments?.length" class="text-gray-500 italic">No reviews yet. Be the first!</div>
    </div>
</div>
