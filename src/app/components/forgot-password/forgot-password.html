<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Reset your password</h1>
    <p class="text-sm text-gray-500 mb-6">
      Enter your username or email address. A reset link will be valid for 30 minutes.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Username or Email</label>
        <input
          type="text"
          formControlName="usernameOrEmail"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border px-3 py-2"
        />
      </div>

      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full bg-primary-600 text-white rounded-md py-2 font-semibold hover:bg-primary-500 disabled:opacity-50"
      >
        Send reset link
      </button>
    </form>

    <div *ngIf="message" class="mt-4 p-4 rounded-lg"
         [class.bg-green-50]="resetLink"
         [class.bg-blue-50]="!resetLink">
      <p class="text-sm font-medium"
         [class.text-green-800]="resetLink"
         [class.text-blue-800]="!resetLink">
        {{ message }}
      </p>
      <div *ngIf="resetLink" class="mt-3 p-3 bg-white border border-green-200 rounded">
        <p class="text-xs text-gray-600 mb-2">Click the link below to reset your password:</p>
        <a [routerLink]="resetLink"
           class="text-blue-600 hover:text-blue-800 font-medium underline break-all">
          {{ getFullResetLink() }}
        </a>
        <p class="text-xs text-gray-500 mt-2">This link will expire in 30 minutes.</p>
      </div>
    </div>

    <div class="mt-6 text-sm text-gray-500">
      <a routerLink="/login" class="text-primary-600 hover:underline">Back to login</a>
    </div>
  </div>
</div>
