<div class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between gap-4">
      <a routerLink="/home" class="text-lg font-bold tracking-tight text-slate-900">
        Coworking Hub Manager
      </a>

      <nav class="hidden md:flex items-center gap-4 text-sm font-medium text-slate-600">
        <a routerLink="/home" routerLinkActive="text-primary-700" class="hover:text-primary-700">Home</a>
        <ng-container *ngIf="(user$ | async) as user">
          <a
            *ngIf="user.type === 'member'"
            routerLink="/search"
            routerLinkActive="text-primary-700"
            class="hover:text-primary-700"
          >
            Search
          </a>
          <a
            *ngIf="user.type !== 'admin'"
            routerLink="/profile"
            routerLinkActive="text-primary-700"
            class="hover:text-primary-700"
          >
            Profile
          </a>
          <a
            *ngIf="user.type === 'manager'"
            routerLink="/manager/dashboard"
            routerLinkActive="text-primary-700"
            class="hover:text-primary-700"
          >
            Manager
          </a>
          <a
            *ngIf="user.type === 'admin'"
            routerLink="/admin/dashboard"
            routerLinkActive="text-primary-700"
            class="hover:text-primary-700"
          >
            Admin
          </a>
        </ng-container>
      </nav>

      <div class="flex items-center gap-3">
        <ng-container *ngIf="(user$ | async) as user; else loggedOut">
          <div class="hidden sm:flex items-center gap-2 text-sm text-slate-600">
            <span class="font-semibold text-slate-900">{{ user.firstName }}</span>
            <span class="text-xs uppercase tracking-wide bg-slate-100 px-2 py-1 rounded-full">{{ user.type }}</span>
          </div>
          <button
            type="button"
            (click)="logout()"
            class="text-sm font-semibold text-white bg-slate-900 px-3 py-2 rounded-md hover:bg-slate-800"
          >
            Log out
          </button>
        </ng-container>
        <ng-template #loggedOut>
          <a routerLink="/login" class="text-sm font-semibold text-slate-700 hover:text-primary-700">Log in</a>
          <a
            routerLink="/register"
            class="text-sm font-semibold text-white bg-primary-600 px-3 py-2 rounded-md hover:bg-primary-500"
          >
            Register
          </a>
        </ng-template>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="bg-slate-900 text-slate-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
      <p class="text-sm text-slate-300">
        Coworking Hub Manager. Manage spaces, reservations, and community feedback in one place.
      </p>
      <div class="text-xs text-slate-400">
        &copy; 2026 Coworking Hub Network
      </div>
    </div>
  </footer>
</div>
