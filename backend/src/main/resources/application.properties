# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/coworking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=coworkingSecretKey2024SuperLongSecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
upload.dir=uploads

# Logging
logging.level.root=INFO
logging.level.com.coworking=DEBUG
